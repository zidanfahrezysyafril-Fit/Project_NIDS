<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar – NIDS Monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    .anim-pulse-glow { animation: pulseGlow 4s ease-in-out infinite; }
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; background:#080B13; overflow:hidden; }
    .modern-card { width:100%; max-width:420px; background:linear-gradient(135deg, rgba(18,24,36,0.88) 0%, rgba(10,14,22,0.94) 100%); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.12); border-radius:24px; padding:36px 32px; box-shadow:0 25px 60px -15px rgba(0,0,0,0.8),0 0 40px rgba(6,182,212,0.1); }
    .input-field { width:100%; padding:12px 14px 12px 42px; background:rgba(9,13,20,0.75); border:1px solid rgba(255,255,255,0.12); border-radius:12px; color:#fff; font-size:14px; font-family:inherit; outline:none; transition:all 0.25s ease; }
    .input-field:focus { border-color:#06B6D4; background:rgba(9,13,20,0.95); box-shadow:0 0 16px rgba(6,182,212,0.25); }
    .btn-gradient-primary { width:100%; padding:13px; border-radius:12px; font-size:14px; font-weight:700; background:linear-gradient(135deg,#06B6D4 0%,#2563EB 50%,#F97316 100%); color:#fff; border:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 8px 24px rgba(6,182,212,0.3); transition:all 0.25s ease; }
    .btn-secondary-custom { width:100%; padding:12px; border-radius:12px; font-size:13.5px; font-weight:600; background:rgba(255,255,255,0.04); color:#C9D1D9; border:1px solid rgba(255,255,255,0.1); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; transition:all 0.25s ease; }
    .btn-secondary-custom:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.25); color:#fff; }
    .form-group { margin-bottom:18px; }
    .form-label { display:block; font-size:12px; font-weight:600; color:#C9D1D9; margin-bottom:6px; }
    .pw-bar { height:100%; width:0%; background:#ff5252; transition:all 0.3s; border-radius:99px; }
  </style>
</head>
<body>
  <!-- Ambient Glow Orbs -->
  <div class="anim-pulse-glow" style="position:fixed;top:-120px;left:15%;width:420px;height:420px;background:rgba(6,182,212,0.15);border-radius:50%;filter:blur(130px);z-index:1;"></div>
  <div class="anim-pulse-glow" style="position:fixed;bottom:-100px;right:15%;width:400px;height:400px;background:rgba(249,115,22,0.12);border-radius:50%;filter:blur(130px);z-index:1;"></div>

  <div class="auth-wrapper">
    <div class="modern-card">
      <div style="text-align:center;margin-bottom:26px;">
        <div style="width:54px;height:54px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,#2563EB,#06B6D4);box-shadow:0 0 25px rgba(6,182,212,0.4);display:flex;align-items:center;justify-content:center;">
          <svg style="width:28px;height:28px;color:#fff;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <h1 style="font-size:22px;font-weight:800;letter-spacing:-0.5px;margin:0 0 4px;color:#fff;">Buat <span style="color:#06B6D4;">Akun</span></h1>
        <p style="font-size:12.5px;color:#8B949E;margin:0;">Mulai pantau keamanan website Anda</p>
      </div>
      <form method="POST" action="{{ url_for('register') }}" id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Nama Lengkap</label>
          <div style="position:relative;">
            <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#64748B;display:flex;">
              <svg style="width:16px;height:16px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A9 9 0 1112 21a9 9 0 01-6.879-3.196"/></svg>
            </span>
            <input type="text" id="name" name="name" class="input-field" placeholder="Nama Anda" required autofocus />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div style="position:relative;">
            <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#64748B;display:flex;">
              <svg style="width:16px;height:16px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            </span>
            <input type="email" id="email" name="email" class="input-field" placeholder="nama@email.com" required />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position:relative;">
            <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#64748B;display:flex;">
              <svg style="width:16px;height:16px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </span>
            <input type="password" id="password" name="password" class="input-field" placeholder="Min. 8 karakter" required minlength="8" style="padding-right:42px;" />
            <button type="button" id="toggle-pw" title="Tampilkan password" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#64748B;padding:4px;display:flex;align-items:center;transition:color 0.2s;">
              <svg id="eye-icon" style="width:16px;height:16px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>
        <!-- Password Strength Bar -->
        <div style="height:4px;border-radius:99px;background:#1a1f30;margin-top:-12px;margin-bottom:16px;overflow:hidden;">
          <div id="pw-bar" class="pw-bar"></div>
        </div>
        <button type="submit" class="btn-gradient-primary" id="btn-register"><span>Daftar Akun</span><svg style="width:15px;height:15px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg></button>
      </form>
      <div style="display:flex;align-items:center;justify-content:center;margin-top:24px;gap:6px;font-size:11px;color:#64748B;">
        <svg style="width:13px;height:13px;color:#10B981;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        <span>Enkripsi Sesi Aktif • Terisolasi 1 Website</span>
      </div>
      <div style="text-align:center;margin-top:16px;">
        <a href="{{ url_for('login') }}" class="btn-secondary-custom" id="btn-goto-login"><svg style="width:15px;height:15px;color:#38BDF8;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12H3m0 0l4-4m-4 4l4 4"/></svg><span>Sudah punya akun? Masuk</span></a>
      </div>
    </div>
  </div>

  <script>
    // Toggle password visibility
    const toggleBtn = document.getElementById('toggle-pw');
    const pwInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    let shown = false;
    toggleBtn.addEventListener('click', () => {
      shown = !shown;
      pwInput.type = shown ? 'text' : 'password';
      if (shown) {
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>`;
        toggleBtn.style.color = '#06B6D4';
      } else {
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
        toggleBtn.style.color = '#64748B';
      }
    });

    // Password strength indicator
    const pwInput2 = document.getElementById('password');
    const pwBar = document.getElementById('pw-bar');
    pwInput2.addEventListener('input', () => {
      const v = pwInput2.value;
      let score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      const colors = ['#ff5252','#ffab40','#40c4ff','#00e676'];
      pwBar.style.width = (score * 25) + '%';
      pwBar.style.background = colors[score-1] || '#1a1f30';
    });

    // Auto-dismiss flash messages (if any)
    setTimeout(() => {
      document.querySelectorAll('.flash').forEach(el => {
        el.style.transition = 'opacity 0.4s';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 400);
      });
    }, 4500);
  </script>
</body>
</html>
